<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWEAKOS // NEXUS MULTI-CORE v12.5</title>
    <style>
        :root {
            --bg: #020203;
            --accent: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.4);
            --panel: rgba(10, 10, 12, 0.98);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; }

        #app { display: flex; flex-direction: column; height: 100%; transition: 0.8s; }
        .blurred { filter: blur(35px) brightness(0.3); }

        .header { padding: 15px; text-align: center; background: #000; border-bottom: 1px solid #1a1a1a; flex-shrink: 0; }
        .tabs { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
        .tab { background: #0a0a0a; border: 1px solid #222; color: #555; padding: 8px 16px; border-radius: 8px; font-size: 10px; text-transform: uppercase; font-weight: 900; cursor: pointer; }
        .tab.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

        #viewport-container { 
            flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
            gap: 15px; padding: 20px; overflow-y: auto; align-content: center; justify-content: center;
        }

        .widget { background: #000; border: 1px solid #1a1a1a; border-radius: 12px; height: 110px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        /* CASE */
        .case-mini { width: 100%; height: 60px; position: relative; overflow: hidden; }
        .case-pointer { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 5; transform: translateX(-50%); }
        .case-tape { display: flex; position: absolute; left: 50%; height: 100%; will-change: transform; }
        .case-item { min-width: 60px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; border-right: 1px solid #111; color: #333; }

        /* WHEEL */
        .wheel-container { position: relative; width: 90px; height: 90px; border-radius: 50%; }
        .wheel-arrow { 
            position: absolute; top: 50%; left: 50%; width: 2px; height: 40px; 
            background: var(--accent); transform-origin: top center; z-index: 10;
            translate: -50% 0; box-shadow: 0 0 10px var(--accent);
        }
        .wheel-arrow::after { content: ''; position: absolute; bottom: -5px; left: -4px; border-left: 5px solid transparent; border-right: 5px solid transparent; border-top: 8px solid var(--accent); }

        /* SLOTS */
        .slot-row { display: flex; gap: 4px; justify-content: center; width: 100%; }
        .slot-col { width: 24px; height: 40px; background: #050505; border: 1px solid #222; border-radius: 4px; overflow: hidden; position: relative; }
        .slot-tape { position: absolute; width: 100%; will-change: transform; }
        .slot-num { height: 40px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; color: #444; }

        /* OVERLAY & SQUARE */
        #overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .winner-container { display: flex; flex-direction: column; align-items: center; opacity: 0; width: 100%; }
        .final-grid { display: flex; flex-wrap: wrap; gap: 45px 25px; justify-content: center; max-width: 95vw; padding-top: 60px; }

        .winner-square { 
            min-width: 110px; height: 110px; padding: 0 15px;
            background: #050505; border: 2px solid var(--accent); border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 0 30px var(--accent-glow);
            position: relative; 
        }
        
        .ez-disk-wrap { 
            position: absolute; top: -45%; left: 50%; transform: translateX(-50%);
            width: 85%; height: 85%; z-index: -1; 
            animation: spinDisk 4s linear infinite; 
            pointer-events: none;
        }

        .win-info { position: relative; z-index: 10; text-align: center; white-space: nowrap; } 
        .win-num { font-size: 42px; font-weight: 900; color: #fff; line-height: 1; }
        .win-meme { margin-top: 50px; font-size: 18px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 5px; text-align: center; }

        @keyframes spinDisk { from { transform: translateX(-50%) rotate(0deg); } to { transform: translateX(-50%) rotate(360deg); } }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.6); }
            15% { opacity: 1; transform: scale(1.05); }
            20% { transform: scale(1); }
            90% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.2); }
        }

        /* CONTROLS */
        .controls { background: var(--panel); padding: 20px; border-radius: 25px 25px 0 0; border-top: 1px solid #222; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .full-grid { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        label { font-size: 8px; color: #444; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        input { background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; width: 100%; text-align: center; font-weight: 900; font-size: 14px; }
        .btn-roll { width: 100%; background: var(--accent); color: #000; border: none; padding: 18px; border-radius: 12px; font-weight: 900; text-transform: uppercase; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div style="font-size: 10px; color: #444; letter-spacing: 3px; font-weight: 900;">NEXUS MULTI-ENGINE v12.5</div>
        <div class="tabs">
            <div class="tab active" onclick="setMode('case')">Cases</div>
            <div class="tab" onclick="setMode('upgrade')">Wheels</div>
            <div class="tab" onclick="setMode('slot')">Slots</div>
        </div>
    </div>
    <div id="viewport-container"></div>
    <div class="controls">
        <div class="input-grid">
            <input type="number" id="min" value="1">
            <input type="number" id="max" value="23">
            <input type="number" id="count" value="1">
        </div>
        <div class="full-grid">
            <label>Exclusion Protocol</label>
            <input type="text" id="exclude" placeholder="e.g. 7, 13">
        </div>
        <button id="roll-btn" class="btn-roll" onclick="roll()">Sync Cores & Execute</button>
    </div>
</div>

<div id="overlay"></div>

<script>
    let mode = 'case';
    let busy = false;
    const memes = ["НУ НЕ РЕГАЕТ!", "СКАМ", "ТАК И ЗНАЛ", "ДЕФОЛТ", "ОПЯТЬ НЕ ТО", "НЕ ПОВЕЗЛО", "КРИНЖ", "ТУПО НЕ ВЕЗЕТ"];

    function setMode(m) {
        if (busy) return;
        mode = m;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('viewport-container').innerHTML = '';
    }

    function roll() {
        if (busy) return;
        const min = parseInt(document.getElementById('min').value);
        const max = parseInt(document.getElementById('max').value);
        const count = Math.min(parseInt(document.getElementById('count').value) || 1, 15);
        const manualExcludes = document.getElementById('exclude').value.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
        
        const container = document.getElementById('viewport-container');
        container.innerHTML = ''; busy = true;

        let results = [];

        for (let i = 0; i < count; i++) {
            let win;
            let att = 0;
            
            function generateNum() {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            do {
                win = generateNum();
                if ((win === 4 || win === 16)) {
                    if (Math.random() < 0.80) {
                        win = generateNum(); 
                    }
                }
                var isExcluded = manualExcludes.includes(win);
                att++;
            } while (isExcluded && att < 100);
            
            results.push(win);
            const widget = document.createElement('div');
            widget.className = 'widget';
            container.appendChild(widget);

            if (mode === 'case') initCase(widget, win, min, max, i);
            else if (mode === 'upgrade') initWheel(widget, win, min, max, i);
            else initSlot(widget, win, max, i);
        }
        setTimeout(() => showFinal(results), mode === 'slot' ? 6000 : 4500);
    }

    function initCase(el, win, min, max, idx) {
        el.innerHTML = `<div class="case-mini"><div class="case-pointer"></div><div class="case-tape" id="t-${idx}"></div></div>`;
        const tape = document.getElementById(`t-${idx}`);
        for(let i=0; i<60; i++) {
            const d = document.createElement('div'); d.className = 'case-item';
            d.innerText = i === 55 ? win : Math.floor(Math.random()*(max-min+1))+min;
            tape.appendChild(d);
        }
        setTimeout(() => {
            tape.style.transition = `transform 3.5s cubic-bezier(0.1, 0, 0, 1)`;
            tape.style.transform = `translateX(-${55*60 + 30}px)`;
        }, 50);
    }

    function initWheel(el, win, min, max, idx) {
        const range = max - min + 1;
        let sectorsSvg = '';
        for(let i = 0; i < Math.min(range, 24); i++) {
            const angle = (360 / Math.min(range, 24)) * i;
            sectorsSvg += `<line x1="50" y1="50" x2="50" y2="5" stroke="#1a1a1a" stroke-width="0.5" transform="rotate(${angle}, 50, 50)" />`;
        }
        el.innerHTML = `
            <div class="wheel-container">
                <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
                    <circle cx="50" cy="50" r="45" fill="#050505" stroke="#1a1a1a" stroke-width="2"/>
                    ${sectorsSvg}
                    <circle cx="50" cy="50" r="4" fill="var(--accent)"/>
                </svg>
                <div class="wheel-arrow" id="arrow-${idx}"></div>
            </div>`;
        setTimeout(() => {
            const arrow = document.getElementById(`arrow-${idx}`);
            const targetAngle = ((win - min) / range) * 360 + (360 * 5);
            arrow.style.transition = `transform 3.5s cubic-bezier(0.1, 0, 0, 1)`;
            arrow.style.transform = `rotate(${targetAngle}deg)`;
        }, 50);
    }

    function initSlot(el, win, maxVal, idx) {
        const reelsCount = maxVal.toString().length;
        el.innerHTML = `<div class="slot-row" id="s-row-${idx}"></div>`;
        const row = document.getElementById(`s-row-${idx}`);
        const winStr = win.toString().padStart(reelsCount, '0');
        for(let i=0; i < reelsCount; i++) {
            const col = document.createElement('div'); col.className = 'slot-col';
            col.innerHTML = `<div class="slot-tape" id="st-${idx}-${i}"></div>`;
            row.appendChild(col);
            const tape = document.getElementById(`st-${idx}-${i}`);
            for(let j=0; j<40; j++) {
                const n = document.createElement('div'); n.className = 'slot-num';
                n.innerText = j === 39 ? winStr[i] : Math.floor(Math.random()*10);
                tape.appendChild(n);
            }
            setTimeout(() => {
                tape.style.transition = `transform ${3 + (i * 0.5)}s cubic-bezier(0.1, 0, 0, 1)`;
                tape.style.transform = `translateY(-${39*40}px)`;
            }, 50);
        }
    }

    function showFinal(nums) {
        document.getElementById('app').classList.add('blurred');
        const over = document.getElementById('overlay'); over.innerHTML = '';
        // Элитные числа: 5 и 21
        const hasSpecial = nums.some(n => n === 5 || n === 21);
        const container = document.createElement('div');
        container.className = 'winner-container';
        container.style.animation = `popIn ${hasSpecial ? 8 : 4}s forwards`;
        const grid = document.createElement('div'); grid.className = 'final-grid';

        nums.forEach(n => {
            const sq = document.createElement('div'); sq.className = 'winner-square';
            const uid = Math.random().toString(36).substr(2, 9);
            const numLen = n.toString().length;
            if(numLen > 2) sq.style.minWidth = (110 + (numLen - 2) * 25) + 'px';

            if (n === 5 || n === 21) {
                sq.innerHTML = `
                <div class="ez-disk-wrap">
                    <svg viewBox="0 0 100 100" style="width:100%; height:100%;">
                        <circle cx="50" cy="50" r="48" fill="#050505" stroke="var(--accent)" stroke-width="1"/>
                        <path id="path-${uid}" d="M 15,50 A 35,35 0 1,1 85,50 A 35,35 0 1,1 15,50" fill="none"/>
                        <text fill="var(--accent)" font-size="7" font-weight="900"><textPath href="#path-${uid}">EZ4ENCE • EZ4ENCE • EZ4ENCE • EZ4ENCE •</textPath></text>
                        <circle cx="50" cy="50" r="12" fill="#000" stroke="var(--accent)" stroke-width="1"/>
                    </svg>
                </div>`;
            }
            sq.innerHTML += `
            <div class="win-info">
                <div style="font-size:7px; color:var(--accent); font-weight:900; margin-bottom:2px; letter-spacing:1px;">CORE RESULT</div>
                <div class="win-num">${n}</div>
            </div>`;
            grid.appendChild(sq);
        });

        const meme = document.createElement('div'); meme.className = 'win-meme';
        meme.innerText = memes[Math.floor(Math.random() * memes.length)];
        container.appendChild(grid); container.appendChild(meme); over.appendChild(container);
        setTimeout(() => {
            document.getElementById('app').classList.remove('blurred');
            over.innerHTML = ''; busy = false;
        }, hasSpecial ? 8000 : 4000);
    }
</script>
</body>
</html>
