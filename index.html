<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Slot Randomizer</title>
    <style>
        :root {
            --primary-color: #00ffcc;
            --bg-dark: #0a0b0d;
            --card-bg: #16181c;
            --text-main: #ffffff;
            --accent-glow: rgba(0, 255, 204, 0.4);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        #main-content {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            transition: filter 0.8s ease, transform 0.8s ease;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .blur-effect {
            filter: blur(15px) brightness(0.2);
            transform: scale(0.92);
            pointer-events: none;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #25282e;
            margin-bottom: 20px;
            flex-shrink: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .input-group { display: flex; flex-direction: column; }
        label { font-size: 10px; text-transform: uppercase; color: #666; margin-bottom: 6px; font-weight: bold; }
        input { 
            background: #1f2229; border: 1px solid #323741; padding: 12px; 
            border-radius: 8px; color: white; font-size: 14px; outline: none;
        }
        input:focus { border-color: var(--primary-color); }

        button {
            grid-column: 1 / -1;
            background: var(--primary-color);
            color: #000; border: none; padding: 16px;
            font-weight: 900; border-radius: 8px; cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase; letter-spacing: 1px;
        }

        button:hover { background: #00d4aa; box-shadow: 0 0 25px var(--accent-glow); transform: translateY(-2px); }

        /* Сетка для рулеток */
        #slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .roulette-wrapper {
            position: relative;
            height: 110px;
            background: #050608;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #25282e;
            transition: all 0.5s ease;
        }

        .selector {
            position: absolute; left: 50%; top: 0; bottom: 0;
            width: 2px; background: var(--primary-color);
            z-index: 10; transform: translateX(-50%);
            box-shadow: 0 0 15px var(--primary-color);
        }

        .track { display: flex; position: absolute; left: 0; top: 0; height: 100%; }

        .number-card {
            min-width: 120px; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; font-weight: 900; color: #222;
            background: linear-gradient(180deg, #1a1d23 0%, #0a0b0d 100%);
            border-right: 1px solid #050608;
            box-sizing: border-box;
        }

        /* Оверлей для финального результата */
        #win-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 100;
        }

        #winner-list {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 40px;
            opacity: 0; transform: translateY(50px) scale(0.8); 
            transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #winner-list.active { opacity: 1; transform: translateY(0) scale(1); }

        .winner-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }

        .winner-ball {
            width: 120px; height: 120px; background: #000;
            border: 4px solid var(--primary-color); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; font-weight: 900; color: var(--primary-color);
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .winner-caption {
            font-size: 14px; font-weight: 800; color: #ff4444;
            text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px;
        }

        .history-mini { font-size: 12px; color: #444; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div id="main-content">
    <h2 style="margin: 0 0 20px 0; letter-spacing: 4px; text-align: center;">SYSTEM RANDOMIZER</h2>
    
    <div class="controls">
        <div class="input-group">
            <label>Чисел (max 15)</label>
            <input type="number" id="count" value="1" min="1" max="15">
        </div>
        <div class="input-group">
            <label>Мин</label>
            <input type="number" id="min" value="1">
        </div>
        <div class="input-group">
            <label>Макс</label>
            <input type="number" id="max" value="100">
        </div>
        <div class="input-group">
            <label>Исключения</label>
            <input type="text" id="exclude" placeholder="4, 16">
        </div>
        <button onclick="startMultiRoll()">ГЕНЕРИРОВАТЬ ВСЕ</button>
    </div>

    <div id="slots-container"></div>
    <div class="history-mini" id="history"></div>
</div>

<div id="win-overlay">
    <div id="winner-list"></div>
</div>

<script>
    const CARD_WIDTH = 120;
    let isRolling = false;

    // Фразы, которые будут появляться снизу
    const captions = [
        "НУ НЕ РЕГАЕТ!",
        "НЕ ПОВЕЗЛО",
        "ДЕФОЛТ",
        "ТАК И ЗНАЛ",
        "НУ КАК ТАК-ТО?",
        "ПОДПОЛНЫЙ РАНДОМ",
        "ЧИСТО ВЕЗЕНИЕ",
        "СКАМ",
        "ОПЯТЬ НЕ ТО",
        "ЛОВИ АПТЕЧКУ"
    ];

    function getRandomInt(min, max, excludes) {
        const minV = parseInt(document.getElementById('min').value);
        const maxV = parseInt(document.getElementById('max').value);
        // Твое условие "но": 4 и 16 в бане, если диапазон 1-23
        let ban = (minV === 1 && maxV === 23) ? [4, 16] : [];
        let finalExcludes = [...excludes, ...ban];
        
        let num;
        let attempts = 0;
        do {
            num = Math.floor(Math.random() * (max - min + 1)) + min;
            attempts++;
        } while (finalExcludes.includes(num) && attempts < 1500);
        return num;
    }

    function startMultiRoll() {
        if (isRolling) return;
        
        const count = Math.min(parseInt(document.getElementById('count').value) || 1, 15);
        const min = parseInt(document.getElementById('min').value);
        const max = parseInt(document.getElementById('max').value);
        const excludes = document.getElementById('exclude').value.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
        
        const container = document.getElementById('slots-container');
        container.innerHTML = '';
        const results = [];
        isRolling = true;

        for (let i = 0; i < count; i++) {
            const res = getRandomInt(min, max, excludes);
            results.push(res);

            const wrapper = document.createElement('div');
            wrapper.className = 'roulette-wrapper';
            wrapper.innerHTML = `<div class="selector"></div><div class="track" id="track-${i}"></div>`;
            container.appendChild(wrapper);

            const track = document.getElementById(`track-${i}`);
            const winIdx = 45 + (i * 2); // Сдвиг для разного времени остановки

            for (let j = 0; j < winIdx + 10; j++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                // В самой ленте 4 и 16 могут мелькать, но не выпадут (по твоему условию)
                card.textContent = (j === winIdx) ? res : Math.floor(Math.random() * (max - min + 1)) + min;
                track.appendChild(card);
            }

            setTimeout(() => {
                const center = wrapper.offsetWidth / 2;
                const targetPos = (winIdx * CARD_WIDTH) - center + (CARD_WIDTH / 2);
                const drift = Math.random() * 60 - 30; // Рандомное положение внутри карточки
                track.style.transition = `transform ${5 + i * 0.3}s cubic-bezier(0.1, 0, 0.1, 1)`;
                track.style.transform = `translateX(-${targetPos + drift}px)`;
            }, 50);
        }

        // Финал анимации
        setTimeout(() => {
            const listContainer = document.getElementById('winner-list');
            listContainer.innerHTML = '';

            results.forEach(num => {
                const wrapper = document.createElement('div');
                wrapper.className = 'winner-container';

                const ball = document.createElement('div');
                ball.className = 'winner-ball';
                ball.textContent = num;

                const cap = document.createElement('div');
                cap.className = 'winner-caption';
                cap.textContent = captions[Math.floor(Math.random() * captions.length)];

                wrapper.appendChild(ball);
                wrapper.appendChild(cap);
                listContainer.appendChild(wrapper);
            });

            document.getElementById('main-content').classList.add('blur-effect');
            listContainer.classList.add('active');

            const hist = document.getElementById('history');
            hist.innerHTML = 'ЛОГ: ' + results.join(', ') + ' | ' + hist.innerHTML;

            setTimeout(() => {
                listContainer.classList.remove('active');
                document.getElementById('main-content').classList.remove('blur-effect');
                isRolling = false;
            }, 4000);

        }, 5500 + (count * 300));
    }
</script>
</body>
</html>
